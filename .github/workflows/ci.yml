name: Validate ds-search

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development validator
        run: python -m pip install -r requirements-dev.txt
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate distributable skill
        run: python tools/check_repository.py
      - name: Check Python compilation
        run: python -m compileall -q skills/ds-search/scripts tools
